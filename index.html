
<!DOCTYPE html>

    <title>Batch Renamer | Team Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>

            font-family: 'Inter', sans-serif;
